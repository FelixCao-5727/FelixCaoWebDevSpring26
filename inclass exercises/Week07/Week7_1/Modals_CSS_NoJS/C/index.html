<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Only Modal</title>
    <!-- Internal Stylesheet -->
    <style type="text/css">
      *{
        box-sizing: border-box;
      }
      html,body{
        margin: 0;
      }
      a.button{
        text-decoration: none;
        color: aliceblue;
        background: #6cf;
        padding: 1rem 2rem;
        border-radius: .5rem;
        display: inline-block;
      }
      .info_modal {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: rgba(0, 0, 0, 0.3);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
      .info_modal:target{
        opacity: none;
        pointer-events: all;
      }
      .info_modal>div{
        width: 600px;
        height: 600px;
        margin: 10% auto;
        position: relative;
        padding: 2rem;
        border-radius: 1rem;
        background-color: #6cf;
      }
      .close{
        position: absolute;
        height: 2rem;
        width: 20rem;
        background-color: blue;
        color: black;
        top: 0;
        right: 0;
        text-decoration: none;
        transition: all 1s ;
      }
    </style>
  </head>
  <body>
    <a href="#info"> modal1 link</a>
    <!-- modal1 -->
     <div id="#info" class="info_modal">
      <div>
        <a href="#close" class="close">X</a>
        <h1>modal1</h1>
        <p>contentjhere</p>
      </div>
     </div>
  </body>
</html>
